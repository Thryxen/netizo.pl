<!doctype html>
<!--
    Obraz do podglądów linków stron usług (strony, sklepy, aplikacje webowe i mobilne, PL i EN): 1200 × 630 px, jasny
    motyw netizo.pl. Ta sama rama co szablon-realizacje.html (logo, poziome linie, szyna z nitami): po lewej nagłówek
    strony i cena „od”, pod dolną linią adres, w prawej kolumnie zdjęcie z hero tej usługi (data URI), a nad nim nazwa
    usługi. Teksty, cenę i zdjęcie podaje generuj.cjs w `values` (ceny jak w App\Enums\Service); znaczniki w podwójnych
    klamrach wypełnia generuj.cjs, nie wpisuj ich w komentarzach.
-->
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <title>OG image netizo, usługa</title>
    <style>
        @font-face {
            font-family: 'Geist';
            font-weight: 400;
            src: url('fonts/geist-400.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist';
            font-weight: 600;
            src: url('fonts/geist-600.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist Mono';
            font-weight: 400;
            src: url('fonts/geist-mono-400.ttf') format('truetype');
        }

        :root {
            --ink: #0a0a0a;
            --paper: #ffffff;
            --muted: #6e6e6e;
            --line: #d6d6d6;
            --rivet: #b3b3b3;

            --rail-x: 64px;
            --column-x: 680px;
            --content-x: 104px;
            --line-top: 140px;
            --line-bottom: 500px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            background: var(--paper);
            -webkit-font-smoothing: antialiased;
        }

        .canvas {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Geist', sans-serif;
        }

        .svg-fit svg {
            display: block;
            width: auto;
            height: 100%;
            overflow: visible;
        }

        /* Zdjęcie z hero usługi: pod górną linią, do dolnej i prawej krawędzi; spokojna ściana po prawej zostaje w kadrze. */
        .photo {
            position: absolute;
            left: var(--column-x);
            right: 0;
            top: var(--line-top);
            bottom: 0;
            display: block;
            width: calc(1200px - var(--column-x));
            height: calc(630px - var(--line-top));
            object-fit: cover;
            object-position: {{photoPosition}};
        }

        .hairline {
            position: absolute;
            left: 0;
            height: 2px;
            background: var(--line);
        }

        .rail {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .rivet {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--rivet);
        }

        .logo {
            position: absolute;
            left: var(--content-x);
            top: 34px;
            height: 72px;
            color: var(--ink);
        }

        .label {
            position: absolute;
            left: calc(var(--column-x) + 48px);
            top: 0;
            height: var(--line-top);
            display: flex;
            align-items: center;
            font-family: 'Geist Mono', monospace;
            font-size: 21px;
            color: var(--muted);
        }

        .headline {
            position: absolute;
            left: var(--content-x);
            right: calc(1200px - var(--column-x) + 32px);
            top: var(--line-top);
            height: calc(var(--line-bottom) - var(--line-top));
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 26px;
        }

        .title {
            font-size: 66px;
            font-weight: 600;
            line-height: 1.04;
            letter-spacing: -0.04em;
        }

        .price {
            font-size: 34px;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--muted);
        }

        .price strong {
            font-weight: 600;
            color: var(--ink);
        }

        .url {
            position: absolute;
            left: var(--content-x);
            top: var(--line-bottom);
            height: calc(630px - var(--line-bottom));
            display: flex;
            align-items: center;
            font-family: 'Geist Mono', monospace;
            /* The longest address (netizo.pl/tworzenie-stron-internetowych) fits the left column at this size. */
            font-size: 21px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="canvas">
        <img class="photo" src="{{photo}}" alt="">

        <span class="hairline" style="top: calc(var(--line-top) - 1px); right: 0"></span>
        <span class="hairline" style="top: calc(var(--line-bottom) - 1px); width: var(--column-x)"></span>
        <span class="rail" style="left: calc(var(--rail-x) - 1px)"></span>
        <span class="rail" style="left: calc(var(--column-x) - 1px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>

        <div class="logo svg-fit">{{logo}}</div>
        <p class="label">{{label}}</p>
        <div class="headline">
            <p class="title">{{headline}}</p>
            <p class="price">{{pricePrefix}} <strong>{{price}}</strong></p>
        </div>
        <p class="url">{{url}}</p>
    </div>
</body>
</html>
