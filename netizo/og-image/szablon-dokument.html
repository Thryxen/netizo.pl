<!doctype html>
<!--
    Obraz do podglądów linków stron prawnych: polityki prywatności i regulaminu, po polsku i po angielsku (1200 × 630 px,
    jasny motyw netizo.pl). Jeden szablon na cztery obrazy; teksty każdego z nich są w generuj.cjs (IMAGES, `values`).
    Ta sama rama co szablon-o-nas.html (logo, poziome linie, szyna z nitami, sygnet N ton w ton), podzielona pionową linią
    jak nagłówek strony: po lewej tytuł dokumentu, po prawej strona, którą dokument wskazuje (karta z legal-hero.tsx).
    Tytuły i etykiety muszą się zgadzać z components/legal/*-copy.tsx, a właściciel z `company` w resources/js/lib/site.ts.
    Bez daty wejścia w życie, żeby obraz nie wymagał zmiany z każdą nową wersją dokumentu.
    Znaczniki w podwójnych klamrach wypełnia generuj.cjs; nie wpisuj ich w komentarzach.
-->
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <title>OG image netizo, {{url}}</title>
    <style>
        @font-face {
            font-family: 'Geist';
            font-weight: 400;
            src: url('fonts/geist-400.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist';
            font-weight: 600;
            src: url('fonts/geist-600.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist Mono';
            font-weight: 400;
            src: url('fonts/geist-mono-400.ttf') format('truetype');
        }

        :root {
            /* Tokeny strony netizo.pl (jasny motyw), jak w szablon.html. */
            --ink: #0a0a0a;
            --paper: #ffffff;
            --muted: #6e6e6e;
            --line: #d6d6d6;
            --rivet: #b3b3b3;
            --mark: #f0f0f0;

            --rail-x: 64px;
            --column-x: 680px;
            --content-x: 104px;
            --party-x: 728px;
            --line-top: 140px;
            --line-bottom: 500px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            background: var(--paper);
            -webkit-font-smoothing: antialiased;
        }

        .canvas {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Geist', sans-serif;
        }

        /* Wstawione SVG skalują się do wysokości kontenera; overflow: visible chroni zaokrąglone końce N. */
        .svg-fit svg {
            display: block;
            width: auto;
            height: 100%;
            overflow: visible;
        }

        /* Wielki sygnet ton w ton w prawej kolumnie, przycięty prawą krawędzią; linie i karta leżą na nim. */
        .mark {
            position: absolute;
            left: 700px;
            top: -5px;
            height: 640px;
            color: var(--mark);
        }

        .hairline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--line);
        }

        .rail {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .rivet {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--rivet);
        }

        .logo {
            position: absolute;
            left: var(--content-x);
            top: 34px;
            height: 72px;
            color: var(--ink);
        }

        .headline {
            position: absolute;
            left: var(--content-x);
            right: calc(1200px - var(--column-x) + 40px);
            top: var(--line-top);
            height: calc(var(--line-bottom) - var(--line-top));
            display: flex;
            align-items: center;
            font-size: 88px;
            font-weight: 600;
            line-height: 1.02;
            letter-spacing: -0.05em;
        }

        .party {
            position: absolute;
            left: var(--party-x);
            right: 64px;
            top: var(--line-top);
            height: calc(var(--line-bottom) - var(--line-top));
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label {
            font-size: 23px;
            line-height: 1.3;
            color: var(--muted);
        }

        .owner {
            margin-top: 10px;
            font-size: 44px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .business {
            margin-top: 8px;
            font-size: 23px;
            line-height: 1.3;
            color: var(--muted);
            text-wrap: balance;
        }

        .contact {
            margin-top: 30px;
            padding-top: 26px;
            border-top: 2px solid var(--line);
            font-family: 'Geist Mono', monospace;
            font-size: 21px;
            color: var(--muted);
        }

        /* Mniejszy niż w innych szablonach (34 px), bo netizo.pl/polityka-prywatnosci musi się zmieścić przed szyną. */
        .url {
            position: absolute;
            left: var(--content-x);
            top: var(--line-bottom);
            height: calc(630px - var(--line-bottom));
            display: flex;
            align-items: center;
            font-family: 'Geist Mono', monospace;
            font-size: 30px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="mark svg-fit">{{sygnet}}</div>

        <span class="hairline" style="top: calc(var(--line-top) - 1px)"></span>
        <span class="hairline" style="top: calc(var(--line-bottom) - 1px)"></span>
        <span class="rail" style="left: calc(var(--rail-x) - 1px)"></span>
        <span class="rail" style="left: calc(var(--column-x) - 1px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>

        <div class="logo svg-fit">{{logo}}</div>

        <h1 class="headline">{{title}}</h1>

        <div class="party">
            <p class="label">{{party}}</p>
            <p class="owner">Kamil Nawrot</p>
            <p class="business">{{business}}</p>
            <p class="contact">kontakt@netizo.pl</p>
        </div>

        <p class="url">{{url}}</p>
    </div>
</body>
</html>
