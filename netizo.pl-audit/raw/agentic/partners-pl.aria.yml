- main:
  - region "Polecasz nas, dostajesz 15% od każdego zamówienia.":
    - heading "Polecasz nas, dostajesz 15% od każdego zamówienia." [level=1]
    - paragraph: Znasz firmę, która potrzebuje strony, sklepu albo aplikacji? Przekaż jej kontakt do nas. Rozmowy, wycenę i wdrożenie bierzemy na siebie, a Ty dostajesz 15% netto od każdej opłaconej faktury tego klienta.
    - link "Dołącz do programu":
      - /url: "#dolacz"
    - link "Policz swoją prowizję":
      - /url: "#kalkulator"
    - paragraph: Udział jest bezpłatny. Odpowiadamy w ciągu 24 godzin.
    - list "Warunki w skrócie":
      - listitem: 15% netto od każdej opłaconej faktury
      - listitem: 12 mies. prowizji od zamówień klienta
      - listitem: 14 dni na przelew po opłaceniu faktury
      - listitem: 0 zł za udział w programie
  - region "Jak to działa":
    - heading "Jak to działa" [level=2]
    - paragraph: Cztery kroki. Ty polecasz, my zajmujemy się resztą.
    - list:
      - listitem:
        - heading "Zgłaszasz się" [level=3]
        - paragraph: Wypełniasz krótki formularz. W ciągu 24 godzin dostajesz kod partnera i umowę do podpisania.
      - listitem:
        - heading "Polecasz nas" [level=3]
        - paragraph: Dajesz znajomej firmie swój kod albo przekazujesz nam jej kontakt. Nie musisz niczego sprzedawać ani negocjować.
      - listitem:
        - heading "My robimy resztę" [level=3]
        - paragraph: Rozmawiamy z klientem, wyceniamy, projektujemy i wdrażamy. O każdym zamówieniu z Twoim kodem dostajesz maila.
      - listitem:
        - heading "Dostajesz 15%" [level=3]
        - paragraph: Po każdej opłaconej fakturze klienta przelewamy Ci 15% jej wartości netto, najpóźniej w ciągu 14 dni.
    - paragraph: Twoja część kończy się na drugim kroku.
    - link "Policz, ile możesz zarobić":
      - /url: "#kalkulator"
  - region "Policz swoją prowizję":
    - heading "Policz swoją prowizję" [level=2]
    - paragraph: Dodaj firmy, które możesz nam polecić. Kwoty to typowe wyceny z naszych realizacji, ostateczna cena zależy od zakresu projektu.
    - heading "Dodaj poleconą firmę" [level=3]
    - list "Dodaj poleconą firmę":
      - listitem:
        - 'button "Dodaj: Prosta strona, 4 000 zł"': Prosta strona 4 000 zł
      - listitem:
        - 'button "Dodaj: Strona firmowa, 10 000 zł"': Strona firmowa 10 000 zł
      - listitem:
        - 'button "Dodaj: Sklep internetowy, 15 000 zł"': Sklep internetowy 15 000 zł
      - listitem:
        - 'button "Dodaj: Aplikacja webowa, 30 000 zł"': Aplikacja webowa 30 000 zł
    - paragraph: Kliknij słupek na wykresie, żeby go usunąć.
    - button "Wyczyść"
    - 'button "Usuń: Strona firmowa, 10 000 zł"'
    - 'button "Usuń: Aplikacja webowa, 30 000 zł"'
    - 'button "Usuń: Sklep internetowy, 15 000 zł"'
    - paragraph: Każdy słupek to jedno zamówienie. Wypełniona część to Twoje 15%.
    - paragraph: 3 firmy, zamówienia za 55 000 zł netto.
    - paragraph:
      - text: Twoja prowizja
      - status: 8 250 zł
    - paragraph: Do tego 15% od kolejnych zamówień tych firm przez 12 miesięcy, na przykład za rozbudowę albo opiekę techniczną.
  - region "Dla kogo jest program":
    - heading "Dla kogo jest program" [level=2]
    - paragraph: "Wystarczy, że rozmawiasz z właścicielami firm. Polecenie zwykle przychodzi samo, w takich sytuacjach:"
    - list:
      - listitem:
        - heading "Biuro rachunkowe" [level=3]
        - paragraph: Klient zakłada firmę i pyta, kto zrobi mu stronę. Odpowiadasz jednym kontaktem.
      - listitem:
        - heading "Agencja marketingowa" [level=3]
        - paragraph: Prowadzisz kampanie, a klientowi brakuje strony albo sklepu, który zamieni ruch w zamówienia.
      - listitem:
        - heading "Grafik, fotograf, copywriter" [level=3]
        - paragraph: Robisz logo, zdjęcia albo teksty. Strona to zwykle następny krok Twojego klienta.
      - listitem:
        - heading "Doradca, konsultant" [level=3]
        - paragraph: Porządkujesz procesy w firmie i widzisz, gdzie przydałby się system albo aplikacja.
      - listitem:
        - heading "Klient Netizo" [level=3]
        - paragraph: Ktoś pyta, kto zrobił Twoją stronę. Od teraz ta odpowiedź się opłaca.
      - listitem:
        - heading "Ktoś, kto zna firmy" [level=3]
        - paragraph: Znasz właścicieli firm z pracy, z branży albo z sąsiedztwa. To wystarczy.
  - region "Zasady programu":
    - heading "Zasady programu" [level=2]
    - paragraph: Pełną umowę dostajesz do przejrzenia przed startem. Najważniejsze punkty są tutaj.
    - term: Prowizja
    - definition: 15% wartości netto każdej faktury opłaconej przez poleconego klienta.
    - term: Jak długo
    - definition: "12 miesięcy od pierwszego zamówienia klienta: projekt, rozbudowa, opieka techniczna."
    - term: Wypłata
    - definition: Przelewem, najpóźniej 14 dni po opłaceniu faktury przez klienta.
    - term: Rozliczenie
    - definition: Na fakturę, jeśli prowadzisz firmę. Na podstawie umowy, jeśli jej nie prowadzisz.
    - term: Kto się liczy
    - definition: Nowa firma, z którą nie rozmawialiśmy o współpracy w ostatnich 12 miesiącach.
    - term: Przypisanie
    - definition: Kod partnera podany przez klienta albo kontakt przekazany przez Ciebie, za zgodą klienta.
    - term: Cena dla klienta
    - definition: Taka sama jak bez polecenia. Prowizję płacimy z naszej marży.
    - term: Limit
    - definition: Nie ma. Polecasz tyle firm, ile chcesz, z całej Polski.
  - region "Częste pytania":
    - heading "Częste pytania" [level=2]
    - paragraph: Nie ma tu Twojego pytania? Napisz, odpowiemy w ciągu 24 godzin.
